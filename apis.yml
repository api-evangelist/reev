aid: reev
name: REEV
description: REEV is a medical-technology company developing AI-powered wearable robotics for
  mobility recovery and neurological gait rehabilitation. Its REEV SENSE platform uses smart
  shoe- and leg-mounted sensors to analyze gait and visualize biomarkers in a mobile app, and
  its DREEVEN motorized knee-ankle-foot orthosis (KAFO) delivers robotic walking assistance
  personalized from REEV SENSE gait data. REEV serves outpatient clinics and rehabilitation
  centers treating stroke, multiple sclerosis, and paraplegia, and is backed by Techstars,
  NVIDIA Inception, and Bpifrance.
